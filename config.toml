[patterns.sensitive_fields]
names = ["email", "username", "phone", "mpin", "wallet_id", "mobile_number"]

[patterns.ssrf_args]
names = ["url", "uri", "webhook", "callback", "redirect", "endpoint", "image_url", "host", "hostname", "domain", "server", "target", "dest", "destination", "proxy", "fetch", "link", "resource", "remote"]

[patterns.idor_mutations]
prefixes = ["delete", "remove", "update", "download", "export"]

[patterns.debug_types]
names = ["admin", "internal", "debug", "private", "test", "dev", "staging"]

[patterns.auth_directives]
names = ["auth", "authenticated", "authorized", "isAuthenticated", "requiresAuth", "hasRole", "permission", "authorize"]

[patterns.user_scope_hints]
names = ["userid", "user_id", "ownerid", "owner_id", "email"]

[patterns.cross_domain_hints]
names = ["programdata", "program_data", "paymentinfo", "payment_info", "privatecomment", "private_comment", "reportsources", "report_sources"]

[patterns.operation_names]
names = []

[session]
auth_header = "Authorization=Bearer YOUR_TOKEN_HERE"
user_id = ""
owned_ids = []

[audit]
test_unauth = true
test_idor = true
test_injection = true # Disabled by default for safety. Set to true to enable SQLi/XSS/SSRF probes.

# Large-schema scope limits (overridden by --max-targets / --max-requests).
# Leave unset to auto-cap large schemas; set to 0 for unlimited.
# max_targets_per_probe = 150
# max_total_requests = 5000

# Safety cap on how many types the __type-walk fallback reconstructs when
# __schema is disabled. Raise it if a large schema is truncated (0 = unlimited).
# Set with: introspectre config set audit.max_type_walk_types 5000
max_type_walk_types = 0

