[package]
name = "introspectre"
version = "1.6.0"
edition = "2021"
description = "A GraphQL offensive-security engine: introspection-driven schema analysis, active vulnerability probing, and an interactive attack-surface report."
license = "MIT"
repository = "https://github.com/m3m0rydmp/Introspectre"
homepage = "https://github.com/m3m0rydmp/Introspectre"
readme = "README.md"
keywords = ["graphql", "security", "pentest", "introspection", "offensive-security"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "resources/*",
    "docs/*",
    "*-visual.html",
    "introspectre.db",
]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22.1"
reqwest = { version = "0.13.3", features = ["json", "query"] }
futures = "0.3.32"
rusqlite = { version = "0.32.1", features = ["bundled"] }
urlencoding = "2.1.3"
quick-xml = { version = "0.36", features = ["serialize"] }
